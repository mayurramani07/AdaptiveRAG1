[project]
name = "adaptive-rag"
version = "0.1.0"
description = "Adaptive RAG (CRAG-based) system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "redis>=5.0",
    "neo4j>=5.24",
    "httpx>=0.27",
    "spacy>=3.8",
    "dateparser>=1.2",
    # pinned wheel URL, not `spacy download` - so `pip install .` alone
    # fetches the NER model too (needed for a Render build step, which
    # can't run an extra download command).
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "fastembed>=0.8",
    "opensearch-py>=3.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI reads File(...)/Form(...) as parameter defaults - it's the
# framework's actual API, not a mutable-default bug (B008's ruff-default
# exemption list already covers fastapi.Depends/Query; File/Form need adding
# explicitly for the new /v1/documents upload endpoint, Phase 11).
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
